openapi: 3.1.0
info:
  title: Iraqi Digital ID Prototype — Issuer Service (internal)
  version: 1.1.0-draft
  description: 'TEST ONLY. Prototype; synthetic data and test keys only. Not an official system.

    Source of truth: API_Contracts §4 (INT-01..INT-07), Enhanced_Architecture §9 (OAS-01..OAS-08).

    Standard protocol endpoints (OpenID4VCI STD-02..STD-07) are NOT redefined here (OAS-02).


    TASK-3 REVIEW CANDIDATE. Not owner-approved and not a service implementation. See docs/task3/G1a_Open_Decisions.md.
    Existing DR proposals retain their original status.

    '
  x-environment: TEST
servers:
- url: https://issuer.digital-id.test
  description: Local test environment (.test reserved TLD)
security: &id001
- serviceToken: []
tags:
- name: offers
  description: Credential offers (slice)
- name: credentials
  description: Credential lifecycle (phase 3 — documented, not built in the slice)
paths:
  /internal/v1/offers:
    post:
      operationId: createOffer
      tags:
      - offers
      summary: INT-01 — create a pre-authorized credential offer
      x-requirements:
      - UC-01
      - T-A01
      - LC-06
      x-roles:
      - issuer-operator
      x-audit-event: offer.created
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
      responses:
        '201':
          description: Offer created. tx_code is returned ONCE and never logged.
          headers:
            X-Environment:
              schema:
                type: string
                const: TEST
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOfferResponse'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: *id001
      description: '

        Authenticate before resource lookup or replay. Require one of these roles: issuer-operator. Enforce resource/organisation
        permissions from verified server-side identity; x-roles alone is not enforcement. 401 for invalid credentials;
        403 for insufficient role. Never expose foreign resource details.'
      x-idempotency:
        status: proposed OD-03
        scope:
        - verified organisation
        - verified subject
        - operationId
        - canonical resource path
        - Idempotency-Key
        retention_seconds: 86400
        request_comparison: Canonical validated semantic JSON; distinguish absent and null; include operation target.
        replay: 'Re-authenticate and re-authorize first; serialize concurrent uses atomically; never repeat side
          effects or return erased/one-time secrets. Different request: 409 API-4090. In-flight: 409 API-4090 with
          Retry-After. After record expiry never resurrect expired resources; enforce independent business uniqueness.'
  /internal/v1/offers/{offer_id}:
    get:
      operationId: getOffer
      tags:
      - offers
      summary: INT-02 — read offer state (no tokens, no values)
      x-requirements:
      - UC-01
      x-roles:
      - issuer-operator
      - auditor
      parameters:
      - $ref: '#/components/parameters/OfferId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Offer state
          headers:
            X-Environment:
              schema:
                type: string
                const: TEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferState'
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: *id001
      description: '

        Authenticate before resource lookup or replay. Require one of these roles: issuer-operator, auditor. Enforce
        resource/organisation permissions from verified server-side identity; x-roles alone is not enforcement.
        401 for invalid credentials; 403 for insufficient role. Never expose foreign resource details.'
  /internal/v1/offers/{offer_id}/cancel:
    post:
      operationId: cancelOffer
      tags:
      - offers
      summary: INT-03 — cancel an unused offer
      x-requirements:
      - T-A03
      x-roles:
      - issuer-operator
      x-audit-event: offer.cancelled
      parameters:
      - $ref: '#/components/parameters/OfferId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason_code:
                  type: string
                  enum:
                  - operator_request
                  - data_error
                  - expired_manually
                  pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
                  minLength: 1
                  maxLength: 64
      responses:
        '204':
          description: Cancelled (repeat on a cancelled offer also returns 204)
          headers:
            X-Environment:
              schema:
                type: string
                const: TEST
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: *id001
      description: '

        Authenticate before resource lookup or replay. Require one of these roles: issuer-operator. Enforce resource/organisation
        permissions from verified server-side identity; x-roles alone is not enforcement. 401 for invalid credentials;
        403 for insufficient role. Never expose foreign resource details.'
      x-idempotency:
        status: proposed OD-03
        scope:
        - verified organisation
        - verified subject
        - operationId
        - canonical resource path
        - Idempotency-Key
        retention_seconds: 86400
        request_comparison: Canonical validated semantic JSON; distinguish absent and null; include operation target.
        replay: 'Re-authenticate and re-authorize first; serialize concurrent uses atomically; never repeat side
          effects or return erased/one-time secrets. Different request: 409 API-4090. In-flight: 409 API-4090 with
          Retry-After. After record expiry never resurrect expired resources; enforce independent business uniqueness.'
  /internal/v1/credentials/{credential_id}:
    get:
      operationId: getCredentialRecord
      tags:
      - credentials
      summary: INT-04 — credential metadata record (phase 3)
      x-phase: 3
      x-roles:
      - issuer-operator
      - issuer-authority
      - auditor
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Metadata only — no claims, no disclosures, no national ID
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CredentialRecord'
                - $ref: '#/components/schemas/CredentialRecordAuthority'
          headers:
            X-Environment:
              schema:
                type: string
                const: TEST
        '404':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: *id001
      description: '

        Authenticate before resource lookup or replay. Require one of these roles: issuer-operator, issuer-authority,
        auditor. Enforce resource/organisation permissions from verified server-side identity; x-roles alone is
        not enforcement. 401 for invalid credentials; 403 for insufficient role. Never expose foreign resource details.
        OD-05: operator/auditor use CredentialRecord; only authorized issuer-authority may use CredentialRecordAuthority.
        JSON Schema cannot determine caller role. This does not remove protocol status index from the signed credential
        or internal allocator response.'
  /internal/v1/credentials/{credential_id}/suspend:
    post:
      operationId: suspendCredential
      tags:
      - credentials
      summary: INT-05 — suspend (status value 2; requires 2-bit list)
      x-phase: 3
      x-requirements:
      - T-S01
      - DR-17
      - DR-29
      x-roles:
      - issuer-authority
      x-audit-event: status.suspended
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/StatusChange'
      responses:
        '200':
          $ref: '#/components/responses/StatusChanged'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: *id001
      description: '

        Authenticate before resource lookup or replay. Require one of these roles: issuer-authority. Enforce resource/organisation
        permissions from verified server-side identity; x-roles alone is not enforcement. 401 for invalid credentials;
        403 for insufficient role. Never expose foreign resource details.'
      x-idempotency:
        status: proposed OD-03
        scope:
        - verified organisation
        - verified subject
        - operationId
        - canonical resource path
        - Idempotency-Key
        retention_seconds: 86400
        request_comparison: Canonical validated semantic JSON; distinguish absent and null; include operation target.
        replay: 'Re-authenticate and re-authorize first; serialize concurrent uses atomically; never repeat side
          effects or return erased/one-time secrets. Different request: 409 API-4090. In-flight: 409 API-4090 with
          Retry-After. After record expiry never resurrect expired resources; enforce independent business uniqueness.'
      x-approval-policy:
        status: pending-owner OD-06
        reference: DR-29 original text unavailable
        proposal: require independent human approval on suspend/reinstate/revoke; exact scope must be approved
  /internal/v1/credentials/{credential_id}/reinstate:
    post:
      operationId: reinstateCredential
      tags:
      - credentials
      summary: INT-06 — lift suspension (from SUSPENDED only, after holder re-authentication)
      x-phase: 3
      x-requirements:
      - T-S02
      - LC-03
      x-roles:
      - issuer-authority
      x-audit-event: status.reinstated
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason_code
              properties:
                reason_code:
                  type: string
                  enum:
                  - reinstated
                  pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
                  minLength: 1
                  maxLength: 64
                approval_ref:
                  type: string
                  maxLength: 64
                  description: 'Pending OD-06 / DR-29: opaque reference, never proof by mere presence. Proposed
                    enforcement resolves an unexpired, unused approval by a distinct authorised human, bound to
                    organisation, target, action and request digest; consume atomically. Missing/invalid required
                    approval => 403 API-4030. Exact required operations await owner decision; not required by this
                    draft schema.'
                  minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/StatusChanged'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: *id001
      description: '

        Authenticate before resource lookup or replay. Require one of these roles: issuer-authority. Enforce resource/organisation
        permissions from verified server-side identity; x-roles alone is not enforcement. 401 for invalid credentials;
        403 for insufficient role. Never expose foreign resource details. Proposed reason_code reinstated denotes
        lifting suspension; holder re-authentication must be verified server-side.'
      x-idempotency:
        status: proposed OD-03
        scope:
        - verified organisation
        - verified subject
        - operationId
        - canonical resource path
        - Idempotency-Key
        retention_seconds: 86400
        request_comparison: Canonical validated semantic JSON; distinguish absent and null; include operation target.
        replay: 'Re-authenticate and re-authorize first; serialize concurrent uses atomically; never repeat side
          effects or return erased/one-time secrets. Different request: 409 API-4090. In-flight: 409 API-4090 with
          Retry-After. After record expiry never resurrect expired resources; enforce independent business uniqueness.'
      x-approval-policy:
        status: pending-owner OD-06
        reference: DR-29 original text unavailable
        proposal: require independent human approval on suspend/reinstate/revoke; exact scope must be approved
  /internal/v1/credentials/{credential_id}/revoke:
    post:
      operationId: revokeCredential
      tags:
      - credentials
      summary: INT-07 — revoke (final; status value 1; never reversed)
      x-phase: 3
      x-requirements:
      - T-S03
      - T-S04
      - LC-02
      x-roles:
      - issuer-authority
      x-audit-event: status.revoked
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/StatusChange'
      responses:
        '200':
          $ref: '#/components/responses/StatusChanged'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security: *id001
      description: '

        Authenticate before resource lookup or replay. Require one of these roles: issuer-authority. Enforce resource/organisation
        permissions from verified server-side identity; x-roles alone is not enforcement. 401 for invalid credentials;
        403 for insufficient role. Never expose foreign resource details.'
      x-idempotency:
        status: proposed OD-03
        scope:
        - verified organisation
        - verified subject
        - operationId
        - canonical resource path
        - Idempotency-Key
        retention_seconds: 86400
        request_comparison: Canonical validated semantic JSON; distinguish absent and null; include operation target.
        replay: 'Re-authenticate and re-authorize first; serialize concurrent uses atomically; never repeat side
          effects or return erased/one-time secrets. Different request: 409 API-4090. In-flight: 409 API-4090 with
          Retry-After. After record expiry never resurrect expired resources; enforce independent business uniqueness.'
      x-approval-policy:
        status: pending-owner OD-06
        reference: DR-29 original text unavailable
        proposal: require independent human approval on suspend/reinstate/revoke; exact scope must be approved
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Proposed TEST AuthProvider bearer contract (DR-05 source missing): validate signature, configured
        algorithm allowlist, issuer, audience, exp/nbf and revocation/session state. Trusted subject, organisation
        and roles come from verified identity only; never from request body. Exact issuer/audience/claims remain
        OD-02.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Proposed OD-03. See operation x-idempotency. Required UUID; 24-hour metadata retention; no replay
        of one-time values.
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
    OfferId:
      name: offer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credential_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    NoStore:
      schema:
        type: string
        const: no-store
  requestBodies:
    StatusChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - reason_code
            properties:
              reason_code:
                type: string
                enum:
                - device_loss
                - compromise
                - data_error
                - superseded
                - holder_request
                - investigation
                pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
                minLength: 1
                maxLength: 64
              approval_ref:
                type: string
                maxLength: 64
                description: 'Pending OD-06 / DR-29: opaque reference, never proof by mere presence. Proposed enforcement
                  resolves an unexpired, unused approval by a distinct authorised human, bound to organisation,
                  target, action and request digest; consume atomically. Missing/invalid required approval => 403
                  API-4030. Exact required operations await owner decision; not required by this draft schema.'
                minLength: 1
  responses:
    Error:
      description: Generic error; no personal values, tokens or internal stack traces.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      headers:
        X-Environment:
          schema:
            type: string
            const: TEST
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
        X-Environment:
          schema:
            type: string
            const: TEST
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StatusChanged:
      description: New state published
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - credential_id
            - state
            - status_published_at
            properties:
              credential_id:
                type: string
                format: uuid
              state:
                type: string
                enum:
                - ACTIVE
                - SUSPENDED
                - REVOKED
              status_published_at:
                type: string
                format: date-time
      headers:
        X-Environment:
          schema:
            type: string
            const: TEST
    BadRequest:
      description: 'Malformed syntax, invalid schema, identifier or required header: API-4001.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: API-4001
              message: BadRequest
              request_id: test-request-1
      headers:
        X-Environment:
          schema:
            type: string
            const: TEST
    Unauthorized:
      description: 'Missing, expired or invalid bearer credential: API-4010.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: API-4010
              message: Unauthorized
              request_id: test-request-1
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer challenge; no token content.
        X-Environment:
          schema:
            type: string
            const: TEST
    Forbidden:
      description: 'Authenticated principal lacks operation role or approved resource permission: API-4030.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: API-4030
              message: Forbidden
              request_id: test-request-1
      headers:
        X-Environment:
          schema:
            type: string
            const: TEST
    Conflict:
      description: 'Idempotency key conflicts with another request, or state conflict: API-4090 unless a documented
        service code applies.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: API-4090
              message: Conflict
              request_id: test-request-1
      headers:
        X-Environment:
          schema:
            type: string
            const: TEST
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Present for an in-flight duplicate only; not an instruction to retry a changed payload.
  schemas:
    CreateOfferRequest:
      type: object
      additionalProperties: false
      required:
      - citizen_ref
      - configuration_id
      properties:
        citizen_ref:
          type: string
          pattern: ^test-citizen-[0-9]{4,}$
          description: Opaque key into the SYNTHETIC registry — never the national ID
        configuration_id:
          type: string
          enum:
          - national_id_test
        renewal_of:
          type:
          - string
          - 'null'
          format: uuid
        replace_existing:
          type: boolean
          default: false
    CreateOfferResponse:
      type: object
      additionalProperties: false
      required:
      - offer_id
      - offer_uri
      - expires_at
      properties:
        offer_id:
          type: string
          format: uuid
        offer_uri:
          type: string
          pattern: ^openid-credential-offer://\?credential_offer_uri=
        expires_at:
          type: string
          format: date-time
        tx_code:
          type: string
          pattern: ^[0-9]{6}$
          description: Present only on first creation; omitted on idempotent replay
    OfferState:
      type: object
      additionalProperties: false
      required:
      - offer_id
      - state
      - created_at
      - expires_at
      properties:
        offer_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - OFFERED
          - ISSUING
          - COMPLETED
          - EXPIRED
          - CANCELLED
          - FAILED
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        failure_code:
          type: string
    CredentialRecord:
      type: object
      additionalProperties: false
      required:
      - credential_id
      - vct
      - state
      - iat
      - exp
      properties:
        credential_id:
          type: string
          format: uuid
        vct:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - REVOKED
          - EXPIRED
        iat:
          type: integer
        exp:
          type: integer
        status_ref:
          type: object
          additionalProperties: false
          properties:
            uri:
              type: string
              format: uri
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              at:
                type: string
                format: date-time
              to:
                type: string
              reason_code:
                type: string
                pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
                minLength: 1
                maxLength: 64
      description: Default metadata projection for operator/auditor. idx forbidden. Proposed OD-05.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
              pattern: ^(API|ISS|STA|VER|TRU)-[0-9]{4}$
            message:
              type: string
              minLength: 1
              maxLength: 200
            request_id:
              type: string
              minLength: 1
              maxLength: 64
    CredentialRecordAuthority:
      type: object
      additionalProperties: false
      required:
      - credential_id
      - vct
      - state
      - iat
      - exp
      properties:
        credential_id:
          type: string
          format: uuid
        vct:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - REVOKED
          - EXPIRED
        iat:
          type: integer
        exp:
          type: integer
        status_ref:
          type: object
          additionalProperties: false
          properties:
            uri:
              type: string
              format: uri
            idx:
              type: integer
              minimum: 0
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              at:
                type: string
                format: date-time
              to:
                type: string
              reason_code:
                type: string
                pattern: ^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$
                minLength: 1
                maxLength: 64
      description: 'Proposed OD-05: only issuer-authority with resource permission may receive idx; omit if not
        necessary.'
x-review-status: proposed-not-approved
