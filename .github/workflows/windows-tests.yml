name: Windows Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project type
        id: detect
        run: |
          $python = (Test-Path pyproject.toml) -or (Test-Path requirements.txt) -or (Test-Path setup.py)
          $node = Test-Path package.json
          "python=$($python.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "node=$($node.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Python project: $python"
          Write-Host "Node project:   $node"

      # ---------- Python ----------
      - name: Set up Python
        if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.detect.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path pyproject.toml) {
            pip install -e ".[test]"
            if ($LASTEXITCODE -ne 0) { pip install -e . }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          pip install pytest

      - name: Run Python tests
        if: steps.detect.outputs.python == 'true'
        run: python -m pytest -v

      # ---------- Node.js ----------
      - name: Set up Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        if: steps.detect.outputs.node == 'true'
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Run Node tests
        if: steps.detect.outputs.node == 'true'
        run: npm test

      # ---------- No project yet ----------
      - name: No test suite found
        if: steps.detect.outputs.python != 'true' && steps.detect.outputs.node != 'true'
        run: |
          Write-Host "No Python or Node.js project detected yet - Windows runner is working."
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
