name: TASK2 Secret Scanner
on:
  pull_request:
  push:
    branches: [task2/secret-scanner]
    paths:
      - tools/lib/**
      - tools/secret-scanner.mjs
      - tools/test-secret-scanner.mjs
      - tools/install-secret-hook.mjs
      - .security/**
      - .githooks/**
      - .github/workflows/task2-secret-scanner.yml
permissions:
  contents: read
jobs:
  scanner:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
          - os: windows-2022
            shell: powershell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout PR contents without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Existing Node 22 baseline
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Scan Git Index, including bounded ZIP members
        shell: ${{ matrix.shell }}
        run: node tools/secret-scanner.mjs --all-index
      - name: Real index and pre-commit integration tests
        shell: ${{ matrix.shell }}
        run: node tools/test-secret-scanner.mjs .
      - name: Verify frozen G1 package and capture read-only repository scan
        shell: ${{ matrix.shell }}
        run: node tools/verify-task2-integrity.mjs .
      - name: Retain redacted test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task2-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/runs/task2-secret-scanner/
          if-no-files-found: error
          retention-days: 30
