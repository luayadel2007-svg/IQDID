name: TASK1 Windows PowerShell 5.1 validation
on:
  push:
    branches: [task1/windows-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-g1:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use documented Node 22 baseline
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Require Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable | Format-List
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 required' }
          node -v
          npm.cmd -v
      - name: Run suite and controlled runner fault tests
        shell: powershell
        run: |
          node tools/test-g1-windows-runner.mjs .
          exit $LASTEXITCODE
      - name: Save raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task1-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/runs/
          if-no-files-found: error
          retention-days: 30
