openapi: 3.1.0
info:
  title: Iraqi Digital ID Prototype — Trust Service
  version: 1.0.0-draft
  description: |
    TEST ONLY. INT-10 signed trust list (our own format — NOT a standard). Verifier entries are keyed by
    x509_hash and bind allowed response_uri hosts, services and claims (DR-14 amended, THM-48; evidenced by W16-b).
    Consumers verify signature + chain to the pinned TEST root, exp, and reject versions older than last seen (SEC-02).
  x-environment: TEST
servers:
  - url: https://trust.digital-id.test
paths:
  /trust/v1/trust-list:
    get:
      operationId: getTrustList
      summary: INT-10 — signed trust list
      security: []
      parameters:
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: Compact JWS whose payload follows TrustListPayload
          headers:
            ETag: { schema: { type: string } }
            X-Environment: { schema: { type: string, const: TEST } }
          content:
            application/jwt:
              schema: { type: string }
        '304': { description: Not modified }
components:
  schemas:
    TrustListPayload:
      type: object
      additionalProperties: false
      required: [version, iat, exp, entries]
      properties:
        version: { type: integer, minimum: 1, description: Monotonic; older versions rejected (SEC-02) }
        iat: { type: integer }
        exp: { type: integer, description: 7 days (DR-16) }
        entries: { type: array, items: { $ref: '#/components/schemas/TrustEntry' } }
    TrustEntry:
      type: object
      additionalProperties: false
      required: [entry_id, role, display_name, identifier, state, valid_from, valid_to]
      properties:
        entry_id: { type: string }
        role: { type: string, enum: [issuer, verifier, status] }
        display_name: { type: object, additionalProperties: false, required: [ar, en], properties: { ar: { type: string }, en: { type: string } } }
        identifier: { type: string, description: 'issuer: https iss; verifier: x509_hash:<b64url sha-256 of leaf DER>; status: status list host' }
        legal_nature: { type: string, enum: [government, private] }
        allowed_vct: { type: array, items: { type: string } }
        allowed_response_hosts: { type: array, items: { type: string } }
        services: { type: array, items: { $ref: '#/components/schemas/ServicePolicy' } }
        state: { type: string, enum: [active, suspended, removed] }
        valid_from: { type: integer }
        valid_to: { type: integer }
    ServicePolicy:
      type: object
      additionalProperties: false
      required: [service_id, purpose, fields, retention, reuse]
      description: Disclosure policy per Legal Report §9.2 (PRV-Consent-and-Mandatory-Disclosure-Policy)
      properties:
        service_id: { type: string }
        purpose: { type: object, additionalProperties: false, required: [ar, en], properties: { ar: { type: string }, en: { type: string } } }
        accepted_vct: { type: array, items: { type: string } }
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [claim, class]
            properties:
              claim: { type: string }
              class: { type: string, enum: [OPTIONAL, SERVICE_REQUIRED, LEGAL_REQUIRED] }
              necessity_statement: { type: string }
        prohibited_claims: { type: array, items: { type: string } }
        legal_basis:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [law_name, law_no, year, article, verification_status]
            properties:
              law_name: { type: string }
              law_no: { type: string }
              year: { type: string }
              article: { type: string }
              paragraph: { type: string }
              official_source_url: { type: string }
              verification_status: { type: string, enum: [unverified, under_review, verified] }
        retention: { type: object, additionalProperties: false, required: [declared], properties: { declared: { type: string, enum: [none, duration] }, duration_days: { type: integer, minimum: 0 } } }
        reuse: { type: string, enum: [prohibited_outside_purpose] }
        may_store_values: { type: array, items: { type: string }, maxItems: 0, description: Empty in the slice (R-POL-06) }
        next_review: { type: string, format: date }
